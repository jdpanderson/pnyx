name: Release

# Pushing a tag vX.Y.Z publishes that version to crates.io. See RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable
  SEMVER_CHECKS_VERSION: 0.50.0

jobs:
  # No cache in this workflow: what it builds is published, so it must not
  # use files that another workflow saved.
  check:
    name: Check the release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select stable Rust
        run: rustup update stable --no-self-update
      - name: Check the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 |
            jq -r '.packages[] | select(.name == "pnyx") | .version')
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::tag $TAG does not match version $version"
            exit 1
          fi
      - name: Check the changelog has this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! grep -q "^## \[${TAG#v}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}"
            exit 1
          fi
      - name: Test
        run: cargo test --locked --all-features
      # Compares the public API with the latest version on crates.io.
      - name: Check semantic versioning
        run: |
          cargo install cargo-semver-checks --locked --version "$SEMVER_CHECKS_VERSION"
          cargo semver-checks --all-features
      - name: Package
        run: cargo package --locked

  publish:
    name: Publish to crates.io
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # crates.io trusts only this repository, workflow and environment.
    environment: release
    permissions:
      contents: read
      id-token: write # Trusted publishing: proves to crates.io which workflow runs.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select stable Rust
        run: rustup update stable --no-self-update
      # Trades this run's identity for a token that lasts 30 minutes.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
