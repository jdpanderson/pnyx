# Weekly update pull requests. The actions are pinned by SHA, so without
# these they never receive fixes. A new version is proposed only after a
# week, which gives time for a compromised release to be found and yanked.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # One pull request for all compatible updates.
      compatible:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
